{% if GA_MEASUREMENT_ID %}
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  {# Consent Mode v2: do czasu zgody GA dostaje tylko pingi bez cookies (modelowanie ruchu z UE). #}
  gtag('consent', 'default', {analytics_storage: 'denied', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied'});
  try { if (localStorage.getItem('cc') === 'accepted') gtag('consent', 'update', {analytics_storage: 'granted'}); } catch (e) {}
  gtag('js', new Date());
  gtag('config', '{{ GA_MEASUREMENT_ID|escapejs }}');
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id={{ GA_MEASUREMENT_ID|urlencode }}"></script>
{% endif %}
