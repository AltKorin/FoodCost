<fieldset class="offer-line border rounded p-3 mb-3">
<legend class="float-none w-auto px-2 fs-6">Pozycja oferty</legend>
{% for hidden in line.hidden_fields %}{{ hidden }}{% endfor %}{{ line.non_field_errors }}
<div class="row g-3">{% for field in line.visible_fields %}<div class="{% if field.name == 'details' %}col-12{% else %}col-md-6{% endif %}"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}{{ field.errors }}</div>{% endfor %}</div>
</fieldset>
