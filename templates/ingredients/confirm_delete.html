{% extends "base.html" %}
{% block title %}Usuń — {{ object }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 480px;">
    <div class="card-body">
        <h1 class="h5">Usunąć „{{ object }}”?</h1>
        <p class="text-muted">Tej operacji nie da się cofnąć.</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Tak, usuń</button>
            <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-outline-secondary">Anuluj</a>
        </form>
    </div>
</div>
{% endblock %}
