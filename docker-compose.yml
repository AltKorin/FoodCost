services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # Celowo BEZ `ports:` — cloudflared dogaduje się z nginx przez wewnętrzną
    # sieć Dockera (`http://nginx:80` w cloudflared/config.yml), więc port 80
    # nie musi (i nie powinien) być publikowany na hoście. Zero otwartych
    # portów na zewnątrz poza tunelem (ten sam wzorzec co agencja-kelnerska).
    depends_on:
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - nginx

volumes:
  pgdata:
  staticfiles:
  media:
