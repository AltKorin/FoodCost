<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie — Food Cost</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a2e; min-height: 100vh; display:flex; align-items:center; }
        .login-card { max-width: 380px; width: 100%; }
        .brand-color { color: #c9a55c; }
    </style>
</head>
<body>
<div class="container">
    <div class="login-card mx-auto">
        <div class="text-center mb-4">
            <h2 class="brand-color fw-bold">Food Cost</h2>
            <p class="text-white-50 small">Hotel Niedźwiadek</p>
        </div>
        <div class="card shadow-lg">
            <div class="card-body p-4">
                <h5 class="card-title mb-4">Zaloguj się</h5>
                {% if form.errors %}
                <div class="alert alert-danger">Nieprawidłowy login lub hasło.</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Login</label>
                        <input type="text" name="username" class="form-control" autofocus autocomplete="username">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Hasło</label>
                        <input type="password" name="password" class="form-control" autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Zaloguj</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
